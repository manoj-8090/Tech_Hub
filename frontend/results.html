<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results & Consensus - TechHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo" onclick="redirect('dashboard.html')" style="cursor:pointer;">TechHub</div>
        <div class="navbar-links">
            <a href="dashboard.html">New Search</a>
            <a href="history.html">History</a>
            <a href="saved.html">Saved</a>
            <a href="profile.html">Profile</a>
            <button class="btn-icon" onclick="toggleTheme()" id="theme-icon" title="Toggle Theme"></button>
            <a href="#" onclick="logout()" style="color:var(--danger);">Logout</a>
        </div>
    </nav>

    <div class="container" style="max-width:1300px;">
        <!-- Top Analytics & Consensus Panels -->
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:20px; margin-bottom:28px;">
            <div class="card" style="cursor:default;">
                <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">Search Analysis</h3>
                <div id="search-analysis-content"></div>
            </div>
            <div class="card" style="cursor:default;">
                <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">Consensus Detection</h3>
                <div id="consensus-content"></div>
            </div>
        </div>

        <!-- Query Header & Action Bar -->
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:20px;">
            <div>
                <h2 id="query-display" style="font-size:26px;font-weight:700;margin-bottom:4px;"></h2>
                <p id="topic-display" style="color:var(--text-secondary);font-size:14px;"></p>
            </div>
            <button class="btn-outline" onclick="copyAllResults()">📋 Copy Full Report</button>
        </div>

        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">
            Sources searched: <span id="sources-displayed"></span>
        </p>

        <!-- Source Filter Chips -->
        <div id="filter-chips-container" class="suggestions" style="justify-content:flex-start;margin-bottom:28px;">
            <span class="chip active-chip" onclick="filterResults('all')">All Sources</span>
            <span class="chip" onclick="filterResults('best')" style="border-color:#F59E0B;color:#F59E0B;font-weight:600;">🏆 Top Real-World Pick</span>
            <span class="chip" onclick="filterResults('ChatGPT')">ChatGPT</span>
            <span class="chip" onclick="filterResults('Gemini AI')">Gemini AI</span>
            <span class="chip" onclick="filterResults('MDN Web Docs')">MDN Docs</span>
            <span class="chip" onclick="filterResults('Stack Overflow')">Stack Overflow</span>
            <span class="chip" onclick="filterResults('GeeksforGeeks')">GeeksforGeeks</span>
            <span class="chip" onclick="filterResults('GitHub')">GitHub</span>
            <span class="chip" onclick="filterResults('Wikipedia')">Wikipedia</span>
            <span class="chip" onclick="filterResults('YouTube')">YouTube</span>
            <span class="chip" onclick="filterResults('Reddit')">Reddit</span>
            <span class="chip" onclick="filterResults('Dev.to')">Dev.to</span>
        </div>

        <!-- Generated Official Links & Reference Documentation Banner -->
        <div id="generated-links-container" style="margin-bottom:24px;"></div>

        <!-- Featured #1 Real-World Answer Banner -->
        <div id="featured-best-container"></div>

        <!-- Results Grid -->
        <div id="results-container"></div>

        <!-- Dynamic Related Questions Section -->
        <div id="related-container" style="margin-top:50px;"></div>

        <div style="text-align:center;margin-top:50px;margin-bottom:30px;">
            <a href="dashboard.html" class="btn-primary">Ask Another Question</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
